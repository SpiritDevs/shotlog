name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "latest release or next snapshot"
        type: choice
        options: [latest, next]
        default: latest
      skip_smoke:
        description: "Emergency latest override: provider outage only"
        type: boolean
        default: false
      reason:
        description: "Release reason; for an override, identify the provider outage and incident"
        type: string
        required: true
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.latest.outputs.published }}
    steps:
      - name: Validate release commit and record any override
        uses: actions/github-script@v7
        env:
          SMOKE_SKIP: ${{ inputs.skip_smoke == true }}
          SMOKE_OVERRIDE_REASON: ${{ inputs.reason }}
          RELEASE_TAG: ${{ inputs.tag || 'latest' }}
        with:
          script: |
            const skip = process.env.SMOKE_SKIP === 'true';
            if (skip) {
              const reason = process.env.SMOKE_OVERRIDE_REASON?.trim();
              if (context.eventName !== 'workflow_dispatch' || !reason || process.env.RELEASE_TAG !== 'latest') {
                throw new Error('Smoke override requires a latest manual dispatch and a non-empty outage reason.');
              }
              core.warning('PRODUCTION SMOKE TEST BYPASSED: real-provider checks will not run.');
              await core.summary
                .addHeading('WARNING: PRODUCTION SMOKE TEST BYPASSED', 1)
                .addRaw('Emergency provider-outage override requested by ' + context.actor + '.\n\n')
                .addCodeBlock(reason, 'text')
                .write();
            }
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Release commit is no longer the current main HEAD; wait for its CI.');
            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha,
                branch: 'main', event: 'push', status: 'success', per_page: 1,
              });
              if (!data.workflow_runs.some(run => run.head_sha === sha)) {
                throw new Error('This exact main commit must pass CI before a manual release, including an override or next snapshot.');
              }
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - run: git switch --create main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global corepack@0.34.6
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Version PR or gated latest publish
        id: latest
        if: inputs.tag != 'next'
        uses: changesets/action@v1
        with:
          publish: pnpm exec tsx scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          SMOKE_SKIP: ${{ inputs.skip_smoke == true }}
          SMOKE_OVERRIDE_REASON: ${{ inputs.reason }}
          SMOKE_REQUIRE_ALL: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMOKE_FROM: ${{ secrets.SMOKE_FROM }}
          SMOKE_INBOX: ${{ secrets.SMOKE_INBOX }}
          SMOKE_SES_REGION: ${{ secrets.SMOKE_SES_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          UPLOADFILE_TOKEN: ${{ secrets.UPLOADFILE_TOKEN }}
          SMOKE_WEBHOOK_URL: ${{ secrets.SMOKE_WEBHOOK_URL }}
          SMOKE_WEBHOOK_SECRET: ${{ secrets.SMOKE_WEBHOOK_SECRET }}
      - name: Publish next snapshot (no production smoke)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'next'
        run: |
          pnpm exec changeset version --snapshot next
          pnpm exec tsx scripts/release.ts --next
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  deploy-site:
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.published == 'true' &&
      inputs.tag != 'next' && inputs.skip_smoke != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check site deployment secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping site deployment: configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24
      - name: Deploy smoke-verified site
        if: steps.secrets.outputs.configured == 'true'
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
