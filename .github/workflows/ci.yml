name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.19, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.34.6
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          SHOTLOG_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm api:check
      - run: pnpm check:no-effect-dts
      - run: pnpm exec changeset status --since=origin/main
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
      - run: pnpm exec changeset status

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shotlog/e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
